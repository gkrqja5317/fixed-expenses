<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#172238;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93b4ff;outline-offset:2px}.app{max-width:580px;margin:auto;min-height:100dvh;padding-bottom:100px}.hero{background:#101827;color:#fff;padding:30px 20px 26px;border-radius:0 0 26px 26px}.eyebrow{opacity:.7;font-size:13px;letter-spacing:.04em}.hero h1{font-size:25px;margin:5px 0 24px}.metric-label{color:#b9c8e0;font-size:14px}.total{font-size:39px;font-weight:800;margin:6px 0 8px;letter-spacing:-1.5px}.submetric{color:#b9c8e0;font-size:13px}main{padding:20px 16px}section{margin-bottom:25px}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.heading h2{font-size:17px;margin:0}.mini{font-size:12px;color:#6b7890}.card{background:white;border-radius:18px;padding:16px;box-shadow:0 3px 14px rgba(20,35,62,.055)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}.baritem{display:grid;gap:7px}.barinfo{display:flex;justify-content:space-between;gap:8px;font-size:14px}.bar{height:8px;border-radius:10px;background:#edf1f7;overflow:hidden}.bar>div{height:100%;background:#4a74ed;border-radius:10px}.baritem:nth-child(even) .bar>div{background:#6aa5c7}.empty{padding:18px;text-align:center;color:#758098;font-size:14px;line-height:1.6}.expense{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f5}.expense:last-child{border-bottom:0}.bubble{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;background:#edf3ff;color:#416bea;font-size:19px}.exp-body{flex:1;min-width:0}.exp-title{font-weight:700;overflow-wrap:anywhere}.exp-detail{font-size:12px;color:#768399;margin-top:5px;overflow-wrap:anywhere}.exp-amount{text-align:right;white-space:nowrap;font-weight:800}.iconbtn{background:none;border:0;color:#6c7c98;padding:5px;margin-left:3px;font-size:19px}.filter{display:flex;gap:8px;overflow:auto;padding:0 0 4px}.chip{border:1px solid #dce4ef;border-radius:30px;background:#fff;padding:9px 14px;white-space:nowrap;color:#4e617e;font-size:13px}.chip.active{background:#17253d;color:#fff;border-color:#17253d}.bottom{position:fixed;bottom:0;left:0;right:0;padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:rgba(245,247,251,.96);backdrop-filter:blur(9px);border-top:1px solid #e6ebf3;z-index:8}.bottom-inner{max-width:548px;margin:auto}.primary{width:100%;background:#3568ec;border:0;color:white;border-radius:15px;font-weight:700;padding:15px;font-size:16px}.secondary{border:1px solid #dde4f0;background:#fff;border-radius:12px;padding:10px 12px;color:#465776;font-size:13px}.small-actions{display:flex;gap:8px;flex-wrap:wrap}.small-actions button{flex:1}.overlay{position:fixed;inset:0;background:#0b142c88;z-index:20;display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{background:#fff;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:580px;max-height:95dvh;overflow:auto}.sheet h2{margin:0 0 18px;font-size:20px}.formgrid{display:grid;gap:13px}.field{display:grid;gap:6px;font-size:13px;font-weight:600;color:#53627b}.field input,.field select{border-radius:12px;padding:13px 12px;border:1px solid #dce3ef;background:#fff;color:#172238;width:100%;font-size:16px;min-width:0}.buttons{display:flex;gap:9px;margin-top:20px}.buttons .secondary{flex:1}.buttons .primary{flex:2}.toggle{display:flex;align-items:center;gap:9px}.toggle input{width:19px;height:19px}.note{color:#77839a;font-size:12px;line-height:1.55}.tip{color:#66758e;font-size:12px;line-height:1.6;margin-top:12px}.sort{font-size:13px;color:#5b6d8c;background:none;border:0}.hidden{display:none!important}@media(min-width:700px){.hero{margin-top:20px;border-radius:24px}}

.versionline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;font-size:12px;color:#b9c8e0}.versionline button{color:#dbe6ff;background:#283950;border:1px solid #566682;padding:7px 11px;border-radius:9px}.metric-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.eye-btn{border:1px solid #52647b;background:#27374d;color:#fff;border-radius:11px;padding:8px 11px;font-size:13px}.update-banner{background:#e9f0ff;border:1px solid #b8cafb;color:#193b87;padding:12px 14px;border-radius:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}.update-banner button{border:0;border-radius:10px;background:#3568ec;color:white;padding:9px 11px;font-weight:700;white-space:nowrap}.bank-chart{display:grid;place-items:center;gap:12px;padding:4px 0 12px}.donut{width:176px;height:176px;border-radius:50%;position:relative;display:grid;place-items:center;background:#e9edf4}.donut::before{content:'';position:absolute;inset:30px;border-radius:50%;background:white}.donut-center{position:relative;z-index:1;font-size:12px;color:#61708a;text-align:center}.donut-center strong{display:block;color:#172238;font-size:17px;margin-top:5px}.legendline{display:flex;align-items:center;gap:8px}.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}.sort-select{font-size:13px;color:#435575;background:white;border:1px solid #dce4ef;border-radius:10px;padding:8px;max-width:135px}
</style>
</head>
<body>
<div class="app"><header class="hero"><div class="eyebrow">MONTHLY FIXED EXPENSES</div><h1>내 고정지출</h1><div class="metric-head"><div class="metric-label">매달 나가는 고정지출</div><button class="eye-btn" type="button" id="toggleTotal" aria-pressed="false">금액 숨기기</button></div><div class="total" id="grandTotal">0원</div><div class="submetric" id="totalCount">등록된 항목 0개</div><div class="versionline"><span id="versionText">현재 버전 v1.1.0</span><button type="button" id="checkUpdate">업데이트 확인</button></div></header>
<main>
<div class="update-banner hidden" id="updateBanner" role="status"><span id="updateMessage">새 버전이 있습니다.</span><button type="button" id="applyUpdate">새로고침</button></div>
<section><div class="heading"><h2>은행별 지출</h2><span class="mini">월 기준</span></div><div class="card"><div id="bankChart" class="bank-chart"></div><div class="stack" id="banks"></div></div></section>
<section><div class="heading"><h2>목적별 지출</h2><span class="mini">월 기준</span></div><div class="card stack" id="purposes"></div></section>
<section><div class="heading"><h2>고정지출 목록</h2><select id="sortSelect" class="sort-select" aria-label="고정지출 정렬"><option value="dayAsc">결제일순</option><option value="dayDesc">결제일 역순</option><option value="amountDesc">금액 높은순</option><option value="amountAsc">금액 낮은순</option></select></div><div class="filter" id="filters"></div><div class="card" id="expenses"></div></section>
<section><div class="heading"><h2>데이터 보관</h2></div><div class="small-actions"><button class="secondary" id="exportBtn">⬇ 백업 저장</button><button class="secondary" id="importBtn">⬆ 백업 불러오기</button><input id="importFile" type="file" accept=".json,application/json" class="hidden"/></div><div class="tip">데이터는 현재 기기 브라우저에 저장됩니다. 브라우저 데이터 삭제 또는 휴대폰 변경에 대비해 백업 파일을 보관하세요.</div></section>
</main></div>
<div class="bottom"><div class="bottom-inner"><button class="primary" id="addBtn">＋ 고정지출 추가</button></div></div>
<div class="overlay" id="overlay" role="presentation"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle"><div class="row"><h2 id="formTitle">고정지출 추가</h2><button type="button" class="iconbtn" id="closeBtn" aria-label="닫기">✕</button></div><form id="expenseForm" class="formgrid"><label class="field">지출 이름<input id="title" required maxlength="60" placeholder="예: 넷플릭스, 휴대폰 요금"/></label><label class="field">은행/카드<input id="bank" required maxlength="40" list="bankOptions" placeholder="예: 국민은행, 신한카드"/><datalist id="bankOptions"><option value="국민은행"><option value="신한은행"><option value="우리은행"><option value="하나은행"><option value="카카오뱅크"><option value="토스뱅크"><option value="농협은행"><option value="신한카드"><option value="현대카드"><option value="삼성카드"></datalist></label><label class="field">사용 목적<select id="purpose" required><option value="주거">주거</option><option value="통신">통신</option><option value="구독">구독</option><option value="보험">보험</option><option value="교통">교통</option><option value="저축">저축</option><option value="대출">대출</option><option value="교육">교육</option><option value="생활">생활</option><option value="여가">여가</option><option value="기타">기타</option></select></label><label class="field">지출 금액 (원)<input id="amount" inputmode="numeric" type="number" min="1" step="1" required placeholder="예: 15000"/></label><label class="field">매월 결제일 (1~31일)<input id="day" inputmode="numeric" type="number" min="1" max="31" required value="1"/></label><label class="toggle"><input id="active" type="checkbox" checked/> 현재 지출 중 (월 합계에 포함)</label><div class="note">29~31일로 설정한 경우 해당 날짜가 없는 달에는 마지막 날 결제하는 것으로 표시됩니다.</div><div class="buttons"><button type="button" class="secondary" id="cancelBtn">취소</button><button type="submit" class="primary">저장</button></div></form></div></div>
<script>
(()=>{'use strict';const KEY='fixedExpenseApp_v1';const APP_VERSION='1.1.0';const HIDE_KEY='fixedExpenseApp_hideTotal';const $=id=>document.getElementById(id);let expenses=[];let editing=null;let filter='전체';let sortBy='dayAsc';let hiddenTotal=localStorage.getItem(HIDE_KEY)==='true';const fmt=n=>Number(n).toLocaleString('ko-KR')+'원';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');expenses=Array.isArray(raw)?raw.filter(valid):[]}catch{expenses=[]}}
function valid(v){return v&&typeof v==='object'&&typeof v.id==='string'&&typeof v.title==='string'&&typeof v.bank==='string'&&typeof v.purpose==='string'&&Number.isInteger(v.amount)&&v.amount>0&&Number.isInteger(v.day)&&v.day>=1&&v.day<=31&&typeof v.active==='boolean'}
function save(){try{localStorage.setItem(KEY,JSON.stringify(expenses));return true}catch(e){alert('기기에 저장하지 못했습니다. 저장 공간 및 브라우저 설정을 확인하세요.');return false}}
function group(key){const map=new Map();expenses.filter(x=>x.active).forEach(x=>map.set(x[key],(map.get(x[key])||0)+x.amount));return [...map].sort((a,b)=>b[1]-a[1])}
function drawChart(){const list=group('bank'),total=list.reduce((s,x)=>s+x[1],0),colors=['#3568ec','#5f99d8','#32b7a1','#f1aa4c','#9c7bce','#e87885','#6c93a5','#84b56c'];const el=$('bankChart');if(!total){el.innerHTML='<div class="empty">은행별 지출을 등록하면 그래프가 표시됩니다.</div>';return;}let end=0;const parts=list.map(([,amount],i)=>{const start=end;end+=amount/total*100;return `${colors[i%colors.length]} ${start.toFixed(3)}% ${end.toFixed(3)}%`});el.innerHTML=`<div class="donut" role="img" aria-label="은행별 지출 비중 그래프" style="background:conic-gradient(${parts.join(',')})"><div class="donut-center">은행별 지출<strong>${fmt(total)}</strong></div></div>`;}
function drawGroups(id,key){const list=group(key),total=list.reduce((s,x)=>s+x[1],0);$(id).innerHTML=list.length?list.map(([name,value])=>`<div class="baritem"><div class="barinfo"><strong>${esc(name)}</strong><strong>${fmt(value)}</strong></div><div class="bar"><div style="width:${total?100*value/total:0}%"></div></div></div>`).join(''):'<div class="empty">등록된 고정지출이 없습니다.</div>'}
function render(){const active=expenses.filter(x=>x.active),total=active.reduce((s,x)=>s+x.amount,0);$('grandTotal').textContent=hiddenTotal?'••••••원':fmt(total);$('toggleTotal').textContent=hiddenTotal?'금액 보기':'금액 숨기기';$('toggleTotal').setAttribute('aria-pressed',String(hiddenTotal));$('totalCount').textContent=`지출 중 ${active.length}개 · 일시 중지 ${expenses.length-active.length}개`;drawChart();drawGroups('banks','bank');drawGroups('purposes','purpose');let cats=['전체',...new Set(expenses.map(x=>x.purpose))];if(!cats.includes(filter))filter='전체';$('filters').innerHTML=cats.map(x=>`<button class="chip ${filter===x?'active':''}" data-filter="${esc(x)}">${esc(x)}</button>`).join('');let rows=expenses.filter(x=>filter==='전체'||x.purpose===filter).sort((a,b)=>sortBy==='amountDesc'?(b.amount-a.amount||a.day-b.day):sortBy==='amountAsc'?(a.amount-b.amount||a.day-b.day):sortBy==='dayDesc'?(b.day-a.day||b.amount-a.amount):(a.day-b.day||b.amount-a.amount));$('expenses').innerHTML=rows.length?rows.map(x=>`<div class="expense"><div class="bubble">${({'주거':'⌂','통신':'☎','구독':'▶','보험':'✚','교통':'↗','저축':'▣','대출':'₩','교육':'✎','생활':'▤','여가':'♫','기타':'•'})[x.purpose]||'•'}</div><div class="exp-body"><div class="exp-title">${esc(x.title)}${x.active?'':' <span class="mini">(중지)</span>'}</div><div class="exp-detail">${esc(x.bank)} · ${esc(x.purpose)} · 매월 ${x.day}일</div></div><div class="exp-amount">${fmt(x.amount)}<div><button class="iconbtn" aria-label="${esc(x.title)} 수정" data-edit="${esc(x.id)}">✎</button><button class="iconbtn" aria-label="${esc(x.title)} 삭제" data-delete="${esc(x.id)}">×</button></div></div></div>`).join(''):'<div class="empty">표시할 항목이 없습니다.<br>아래 버튼으로 고정지출을 추가하세요.</div>'}
function show(item){editing=item?item.id:null;$('formTitle').textContent=item?'고정지출 수정':'고정지출 추가';$('expenseForm').reset();$('title').value=item?.title||'';$('bank').value=item?.bank||'';$('purpose').value=item?.purpose||'주거';$('amount').value=item?.amount||'';$('day').value=item?.day||1;$('active').checked=item?item.active:true;$('overlay').classList.add('open');$('title').focus()}
function hide(){$('overlay').classList.remove('open');editing=null}
$('expenseForm').addEventListener('submit',e=>{e.preventDefault();const item={id:editing||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())+Math.random()),title:$('title').value.trim(),bank:$('bank').value.trim(),purpose:$('purpose').value,amount:Number($('amount').value),day:Number($('day').value),active:$('active').checked};if(!item.title||!item.bank||!Number.isSafeInteger(item.amount)||item.amount<=0||!Number.isInteger(item.day)||item.day<1||item.day>31){alert('입력한 내용을 확인하세요.');return}const prior=[...expenses];if(editing){expenses=expenses.map(x=>x.id===editing?item:x)}else{expenses.push(item)}if(!save()){expenses=prior;return}hide();render()});
$('expenses').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const item=expenses.find(x=>x.id===edit.dataset.edit);if(item)show(item)}if(del){const item=expenses.find(x=>x.id===del.dataset.delete);if(item&&confirm(`'${item.title}' 항목을 삭제할까요?`)){const prior=[...expenses];expenses=expenses.filter(x=>x.id!==item.id);if(!save())expenses=prior;render()}}});$('filters').addEventListener('click',e=>{const el=e.target.closest('[data-filter]');if(el){filter=el.dataset.filter;render()}});$('sortSelect').onchange=e=>{sortBy=e.target.value;render()};$('toggleTotal').onclick=()=>{hiddenTotal=!hiddenTotal;try{localStorage.setItem(HIDE_KEY,String(hiddenTotal))}catch{}render()};$('addBtn').onclick=()=>show();$('closeBtn').onclick=hide;$('cancelBtn').onclick=hide;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'fixed-expenses',version:1,exportedAt:new Date().toISOString(),expenses},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='고정지출_백업_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='fixed-expenses'||obj.version!==1||!Array.isArray(obj.expenses)||!obj.expenses.every(valid))throw Error('지원하지 않는 파일 형식입니다.');if(!confirm(`백업된 ${obj.expenses.length}개 항목으로 현재 데이터를 교체할까요?`))return;const prior=[...expenses];expenses=obj.expenses;if(!save()){expenses=prior;return}filter='전체';render();alert('백업을 불러왔습니다.')}catch(err){alert('백업 파일을 읽지 못했습니다: '+err.message)}finally{e.target.value=''}};
load();render();})();
// Update check is online-only. It never replaces expense records.
(()=>{'use strict';const APP_VERSION='1.1.0';let pendingWorker=null;let latestVersion=null;const $=id=>document.getElementById(id);function showUpdate(label){$('updateMessage').textContent=label;$('updateBanner').classList.remove('hidden')};function showCurrent(){if(!pendingWorker && !latestVersion){$('updateBanner').classList.add('hidden')}}
async function checkUpdate(manual=false){if(!navigator.onLine){if(manual)alert('인터넷 연결이 필요합니다.');return}try{const response=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('version fetch failed');const obj=await response.json();if(typeof obj.version==='string'&&obj.version!==APP_VERSION){latestVersion=obj.version;showUpdate('새 버전 v'+obj.version+'이 있습니다. 업데이트해 주세요.')}else if(!pendingWorker){latestVersion=null;showCurrent();if(manual)alert('현재 최신 버전(v'+APP_VERSION+')입니다.')}}catch{if(manual)alert('업데이트 정보를 확인할 수 없습니다. 네트워크를 확인하세요.')}if('serviceWorker' in navigator){navigator.serviceWorker.getRegistration().then(reg=>{if(reg){reg.update().catch(()=>{});if(reg.waiting){pendingWorker=reg.waiting;showUpdate('앱 업데이트가 준비되었습니다.');}}}).catch(()=>{})}}
$('checkUpdate').onclick=()=>checkUpdate(true);$('applyUpdate').onclick=()=>{if(pendingWorker){pendingWorker.postMessage({type:'SKIP_WAITING'});setTimeout(()=>location.reload(),1300)}else location.reload()};if('serviceWorker' in navigator){navigator.serviceWorker.addEventListener('controllerchange',()=>{showUpdate('새 앱 버전이 적용되었습니다. 새로고침해 주세요.');});navigator.serviceWorker.ready.then(reg=>{if(reg.waiting){pendingWorker=reg.waiting;showUpdate('앱 업데이트가 준비되었습니다.')}reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(worker)worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller){pendingWorker=worker;showUpdate('앱 업데이트가 준비되었습니다.')}})})}).catch(()=>{})}window.addEventListener('online',()=>checkUpdate(false));document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)});window.addEventListener('load',()=>setTimeout(()=>checkUpdate(false),800));})();
</script><script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn)); }</script></body></html>
