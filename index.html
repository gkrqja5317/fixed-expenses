<!doctype html>
<html lang="ko">
<head>

<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#172238;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93b4ff;outline-offset:2px}.app{max-width:580px;margin:auto;min-height:100dvh;padding-bottom:100px}.hero{background:#101827;color:#fff;padding:30px 20px 26px;border-radius:0 0 26px 26px}.eyebrow{opacity:.7;font-size:13px;letter-spacing:.04em}.hero h1{font-size:25px;margin:5px 0 24px}.metric-label{color:#b9c8e0;font-size:14px}.total{font-size:39px;font-weight:800;margin:6px 0 8px;letter-spacing:-1.5px}.submetric{color:#b9c8e0;font-size:13px}main{padding:20px 16px}section{margin-bottom:25px}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.heading h2{font-size:17px;margin:0}.mini{font-size:12px;color:#6b7890}.card{background:white;border-radius:18px;padding:16px;box-shadow:0 3px 14px rgba(20,35,62,.055)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}.baritem{display:grid;gap:7px}.barinfo{display:flex;justify-content:space-between;gap:8px;font-size:14px}.bar{height:8px;border-radius:10px;background:#edf1f7;overflow:hidden}.bar>div{height:100%;background:#4a74ed;border-radius:10px}.baritem:nth-child(even) .bar>div{background:#6aa5c7}.empty{padding:18px;text-align:center;color:#758098;font-size:14px;line-height:1.6}.expense{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f5}.expense:last-child{border-bottom:0}.bubble{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;background:#edf3ff;color:#416bea;font-size:19px}.exp-body{flex:1;min-width:0}.exp-title{font-weight:700;overflow-wrap:anywhere}.exp-detail{font-size:12px;color:#768399;margin-top:5px;overflow-wrap:anywhere}.exp-amount{text-align:right;white-space:nowrap;font-weight:800}.iconbtn{background:none;border:0;color:#6c7c98;padding:5px;margin-left:3px;font-size:19px}.filter{display:flex;gap:8px;overflow:auto;padding:0 0 4px}.chip{border:1px solid #dce4ef;border-radius:30px;background:#fff;padding:9px 14px;white-space:nowrap;color:#4e617e;font-size:13px}.chip.active{background:#17253d;color:#fff;border-color:#17253d}.bottom{position:fixed;bottom:0;left:0;right:0;padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:rgba(245,247,251,.96);backdrop-filter:blur(9px);border-top:1px solid #e6ebf3;z-index:8}.bottom-inner{max-width:548px;margin:auto}.primary{width:100%;background:#3568ec;border:0;color:white;border-radius:15px;font-weight:700;padding:15px;font-size:16px}.secondary{border:1px solid #dde4f0;background:#fff;border-radius:12px;padding:10px 12px;color:#465776;font-size:13px}.small-actions{display:flex;gap:8px;flex-wrap:wrap}.small-actions button{flex:1}.overlay{position:fixed;inset:0;background:#0b142c88;z-index:20;display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{background:#fff;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:580px;max-height:95dvh;overflow:auto}.sheet h2{margin:0 0 18px;font-size:20px}.formgrid{display:grid;gap:13px}.field{display:grid;gap:6px;font-size:13px;font-weight:600;color:#53627b}.field input,.field select{border-radius:12px;padding:13px 12px;border:1px solid #dce3ef;background:#fff;color:#172238;width:100%;font-size:16px;min-width:0}.buttons{display:flex;gap:9px;margin-top:20px}.buttons .secondary{flex:1}.buttons .primary{flex:2}.toggle{display:flex;align-items:center;gap:9px}.toggle input{width:19px;height:19px}.note{color:#77839a;font-size:12px;line-height:1.55}.tip{color:#66758e;font-size:12px;line-height:1.6;margin-top:12px}.sort{font-size:13px;color:#5b6d8c;background:none;border:0}.hidden{display:none!important}@media(min-width:700px){.hero{margin-top:20px;border-radius:24px}}

.versionline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;font-size:12px;color:#b9c8e0}.versionline button{color:#dbe6ff;background:#283950;border:1px solid #566682;padding:7px 11px;border-radius:9px}.metric-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.eye-btn{border:1px solid #52647b;background:#27374d;color:#fff;border-radius:11px;padding:8px 11px;font-size:13px}.update-banner{background:#e9f0ff;border:1px solid #b8cafb;color:#193b87;padding:12px 14px;border-radius:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}.update-banner button{border:0;border-radius:10px;background:#3568ec;color:white;padding:9px 11px;font-weight:700;white-space:nowrap}.bank-chart{display:grid;place-items:center;gap:12px;padding:4px 0 12px}.donut{width:176px;height:176px;border-radius:50%;position:relative;display:grid;place-items:center;background:#e9edf4}.donut::before{content:'';position:absolute;inset:30px;border-radius:50%;background:white}.donut-center{position:relative;z-index:1;font-size:12px;color:#61708a;text-align:center}.donut-center strong{display:block;color:#172238;font-size:17px;margin-top:5px}.legendline{display:flex;align-items:center;gap:8px}.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}.sort-select{font-size:13px;color:#435575;background:white;border:1px solid #dce4ef;border-radius:10px;padding:8px;max-width:135px}

/* v1.2: four-tab, small-screen-first PWA layout */
.app{padding-bottom:calc(220px + env(safe-area-inset-bottom))}
.tabnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e1e7f1;padding:9px 10px;box-shadow:0 3px 12px rgba(22,32,55,.04)}
.tab{border:0;background:transparent;border-radius:11px;color:#52617b;padding:12px 2px;font-weight:700;font-size:13px;white-space:nowrap}
.tab.active{background:#17253d;color:#fff}
.tab-panel{min-height:50dvh}
.tab-panel main{padding-top:18px}
.bottom{padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.bottom-inner{display:grid;gap:8px}
.bottom-backups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bottom-backups .secondary{font-size:13px;font-weight:650;padding:10px 6px}
.bottom .primary{padding:13px;font-size:15px}
.update-banner{margin:10px 16px 0}
@media(min-width:700px){.tabnav{border-radius:16px}.hero{margin-top:14px}}

/* Home-only compact, horizontal 2-up charts. Other tabs stay unchanged. */
.home-charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.home-chart-section{min-width:0;margin-bottom:0}
.home-chart-section .heading{min-height:24px;margin-bottom:9px}
.home-chart-section .heading h2{font-size:15px;line-height:1.3}
.home-chart-section .card{padding:12px 9px;min-width:0;border-radius:16px}
.home-chart-section .bank-chart{padding:3px 0 12px;min-width:0}
.home-chart-section .donut{width:min(100%,138px);height:auto;aspect-ratio:1/1}
.home-chart-section .donut::before{inset:22%}
.home-chart-section .donut-center{font-size:10px;max-width:80%;overflow-wrap:anywhere}
.home-chart-section .donut-center strong{font-size:clamp(10px,2.5vw,13px);margin-top:3px;letter-spacing:-.45px;white-space:nowrap}
.home-chart-section .stack{gap:9px}
.home-chart-section .baritem{gap:4px;min-width:0}
.home-chart-section .barinfo{display:flex;flex-direction:column;gap:2px;font-size:11px;line-height:1.3;min-width:0}
.home-chart-section .barinfo strong{overflow-wrap:anywhere}
.home-chart-section .barinfo strong:last-child{color:#566784;font-size:11px}
.home-chart-section .bar{height:6px}
.home-chart-section .empty{font-size:11px;padding:10px 2px}
@media(min-width:480px){.home-charts{gap:14px}.home-chart-section .card{padding:16px}.home-chart-section .donut{width:162px}.home-chart-section .barinfo{flex-direction:row;font-size:12px}.home-chart-section .barinfo strong:last-child{font-size:12px}}

/* v1.2.0: bottom navigation, swipe between panels, compact fixed actions */
.bottom{padding:8px max(10px,env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.bottom-inner{gap:6px}
.bottom-backups{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bottom-backups .secondary{padding:9px 3px;font-size:11px;white-space:nowrap}
.bottom .primary{padding:11px;font-size:14px}
.bottom .tabnav{position:static;top:auto;z-index:auto;background:transparent;border-bottom:0;border-top:1px solid #e1e7f1;box-shadow:none;padding:5px 0 1px;gap:3px}
.bottom .tab{padding:11px 1px;font-size:12px}
.tab-panel{touch-action:pan-y}
@media(min-width:700px){.bottom .tabnav{border-radius:0}}
</style>
</head>
<body>
<div class="app">
<div class="update-banner hidden" id="updateBanner" role="status"><span id="updateMessage">새 버전이 있습니다.</span><button type="button" id="applyUpdate">업데이트</button></div>
<div id="tab-home" class="tab-panel" role="tabpanel" aria-labelledby="tabbtn-home">
<header class="hero"><div class="eyebrow">MONTHLY FIXED EXPENSES</div><h1>내 고정지출</h1><div class="metric-head"><div class="metric-label">매달 나가는 고정지출</div><button class="eye-btn" type="button" id="toggleTotal" aria-pressed="false">금액 숨기기</button></div><div class="total" id="grandTotal">0원</div><div class="submetric" id="totalCount">등록된 항목 0개</div><div class="versionline"><span id="versionText">현재 버전 v1.2.0</span><button type="button" id="checkUpdate">업데이트 확인</button></div></header>
<main class="home-main"><div class="home-charts"><section class="home-chart-section"><div class="heading"><h2>은행별 지출</h2></div><div class="card"><div id="homeBankChart" class="bank-chart"></div><div class="stack" id="homeBanks"></div></div></section>
<section class="home-chart-section"><div class="heading"><h2>목적별 지출</h2></div><div class="card"><div id="homePurposeChart" class="bank-chart"></div><div class="stack" id="homePurposes"></div></div></section></div></main></div>
<div id="tab-bank" class="tab-panel hidden" role="tabpanel" aria-labelledby="tabbtn-bank"><main><section><div class="heading"><h2>은행별 지출</h2><span class="mini">월 기준</span></div><div class="card"><div id="bankChart" class="bank-chart"></div><div class="stack" id="banks"></div></div></section>
<section><div class="heading"><h2>은행별 지출 목록</h2><select id="bankSortSelect" class="sort-select" aria-label="은행별 목록 정렬"><option value="dayAsc">결제일순</option><option value="dayDesc">결제일 역순</option><option value="amountDesc">고액순</option><option value="amountAsc">저액순</option></select></div><div class="filter" id="bankFilters"></div><div class="card" id="bankExpenses"></div></section></main></div>
<div id="tab-purpose" class="tab-panel hidden" role="tabpanel" aria-labelledby="tabbtn-purpose"><main><section><div class="heading"><h2>목적별 지출</h2><span class="mini">월 기준</span></div><div class="card"><div id="purposeChart" class="bank-chart"></div><div class="stack" id="purposes"></div></div></section>
<section><div class="heading"><h2>목적별 지출 목록</h2><select id="purposeSortSelect" class="sort-select" aria-label="목적별 목록 정렬"><option value="dayAsc">결제일순</option><option value="dayDesc">결제일 역순</option><option value="amountDesc">고액순</option><option value="amountAsc">저액순</option></select></div><div class="filter" id="purposeFilters"></div><div class="card" id="purposeExpenses"></div></section></main></div>
<div id="tab-list" class="tab-panel hidden" role="tabpanel" aria-labelledby="tabbtn-list"><main><section><div class="heading"><h2>전체 고정지출 목록</h2><select id="sortSelect" class="sort-select" aria-label="전체 목록 정렬"><option value="dayAsc">결제일순</option><option value="dayDesc">결제일 역순</option><option value="amountDesc">고액순</option><option value="amountAsc">저액순</option></select></div><div class="filter" id="filters"></div><div class="card" id="expenses"></div></section></main></div>
</div>
<div class="bottom"><div class="bottom-inner"><nav class="tabnav" role="tablist" aria-label="지출 화면 선택">
<button class="tab active" role="tab" aria-selected="true" aria-controls="tab-home" id="tabbtn-home" data-tab="home">홈</button>
<button class="tab" role="tab" aria-selected="false" aria-controls="tab-bank" id="tabbtn-bank" data-tab="bank">은행별</button>
<button class="tab" role="tab" aria-selected="false" aria-controls="tab-purpose" id="tabbtn-purpose" data-tab="purpose">목적별</button>
<button class="tab" role="tab" aria-selected="false" aria-controls="tab-list" id="tabbtn-list" data-tab="list">전체 목록</button>
</nav><button class="primary" id="addBtn" type="button">＋ 고정지출 추가</button><div class="bottom-backups"><button class="secondary" id="exportBtn" type="button">↓ 백업 저장</button><button class="secondary" id="importBtn" type="button">↑ 백업 불러오기</button><button class="secondary" id="shareBtn" type="button" aria-label="총 고정지출 금액 공유">↗ 금액 공유</button><input id="importFile" type="file" accept=".json,application/json" class="hidden"/></div></div></div>
<div class="overlay" id="overlay" role="presentation"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle"><div class="row"><h2 id="formTitle">고정지출 추가</h2><button type="button" class="iconbtn" id="closeBtn" aria-label="닫기">✕</button></div><form id="expenseForm" class="formgrid"><label class="field">지출 이름<input id="title" required maxlength="60" placeholder="예: 넷플릭스, 휴대폰 요금"/></label><label class="field">은행/카드<input id="bank" required maxlength="40" list="bankOptions" placeholder="예: 국민은행, 신한카드"/><datalist id="bankOptions"><option value="국민은행"><option value="신한은행"><option value="우리은행"><option value="하나은행"><option value="카카오뱅크"><option value="토스뱅크"><option value="농협은행"><option value="신한카드"><option value="현대카드"><option value="삼성카드"></datalist></label><label class="field">사용 목적<select id="purpose" required><option value="주거">주거</option><option value="통신">통신</option><option value="구독">구독</option><option value="보험">보험</option><option value="교통">교통</option><option value="저축">저축</option><option value="대출">대출</option><option value="교육">교육</option><option value="생활">생활</option><option value="여가">여가</option><option value="기타">기타</option></select></label><label class="field">지출 금액 (원)<input id="amount" inputmode="numeric" type="number" min="1" step="1" required placeholder="예: 15000"/></label><label class="field">매월 결제일 (1~31일)<input id="day" inputmode="numeric" type="number" min="1" max="31" required value="1"/></label><label class="toggle"><input id="active" type="checkbox" checked/> 현재 지출 중 (월 합계에 포함)</label><div class="note">29~31일로 설정한 경우 해당 날짜가 없는 달에는 마지막 날 결제하는 것으로 표시됩니다.</div><div class="buttons"><button type="button" class="secondary" id="cancelBtn">취소</button><button type="submit" class="primary">저장</button></div></form></div></div>
<script>
(()=>{'use strict';
const KEY='fixedExpenseApp_v1',APP_VERSION='1.2.0',HIDE_KEY='fixedExpenseApp_hideTotal';
const $=id=>document.getElementById(id);
let expenses=[],editing=null,hiddenTotal=localStorage.getItem(HIDE_KEY)==='true';
let tab='home';let filter='전체',bankFilter='전체',purposeFilter='전체';
let sortBy='dayAsc',bankSort='dayAsc',purposeSort='dayAsc';
const fmt=n=>Number(n).toLocaleString('ko-KR')+'원';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colors=['#3568ec','#699bd7','#59b2a1','#efae59','#9d7fd4','#dc7795','#6e91a3','#96b66c'];
function valid(v){return v&&typeof v==='object'&&typeof v.id==='string'&&typeof v.title==='string'&&typeof v.bank==='string'&&typeof v.purpose==='string'&&Number.isInteger(v.amount)&&v.amount>0&&Number.isInteger(v.day)&&v.day>=1&&v.day<=31&&typeof v.active==='boolean'}
function load(){try{let raw=JSON.parse(localStorage.getItem(KEY)||'[]');expenses=Array.isArray(raw)?raw.filter(valid):[]}catch{expenses=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(expenses));return true}catch{alert('기기에 저장하지 못했습니다. 저장 공간 및 브라우저 설정을 확인하세요.');return false}}
function group(key){const map=new Map();for(const x of expenses){if(!x.active)continue;map.set(x[key],(map.get(x[key])||0)+x.amount)}return [...map].sort((a,b)=>b[1]-a[1])}
function drawChart(id,key){const list=group(key),total=list.reduce((a,v)=>a+v[1],0),el=$(id);if(!total){el.innerHTML='<div class="empty">등록된 지출이 없으면 그래프가 표시되지 않습니다.</div>';return}
let end=0;const parts=list.map(([,amt],i)=>{const start=end;end+=100*amt/total;return `${colors[i%colors.length]} ${start.toFixed(3)}% ${end.toFixed(3)}%`});
const label=key==='bank'?'은행별':'목적별';el.innerHTML=`<div class="donut" role="img" aria-label="${label} 지출 비중 그래프" style="background:conic-gradient(${parts.join(',')})"><div class="donut-center">${label} 지출<strong>${fmt(total)}</strong></div></div>`}
function drawGroups(id,key){const list=group(key),total=list.reduce((s,x)=>s+x[1],0);$(id).innerHTML=list.length?list.map(([name,value],i)=>`<div class="baritem"><div class="barinfo"><strong>${esc(name)}</strong><strong>${fmt(value)}</strong></div><div class="bar"><div style="width:${total?100*value/total:0}%;background:${colors[i%colors.length]}"></div></div></div>`).join(''):'<div class="empty">등록된 고정지출이 없습니다.</div>'}
function chips(id,values,current){$(id).innerHTML=values.map(x=>`<button class="chip ${current===x?'active':''}" data-filter="${esc(x)}" type="button">${esc(x)}</button>`).join('')}
function sortedRows(rows,sort){return rows.sort((a,b)=>sort==='amountDesc'?(b.amount-a.amount||a.day-b.day):sort==='amountAsc'?(a.amount-b.amount||a.day-b.day):sort==='dayDesc'?(b.day-a.day||b.amount-a.amount):(a.day-b.day||b.amount-a.amount))}
function drawList(id,rows,sort){rows=sortedRows(rows,sort);$(id).innerHTML=rows.length?rows.map(x=>`<div class="expense"><div class="bubble">${({'주거':'⌂','통신':'☎','구독':'▶','보험':'✚','교통':'↗','저축':'▣','대출':'₩','교육':'✎','생활':'▤','여가':'♫','기타':'•'})[x.purpose]||'•'}</div><div class="exp-body"><div class="exp-title">${esc(x.title)}${x.active?'':' <span class="mini">(중지)</span>'}</div><div class="exp-detail">${esc(x.bank)} · ${esc(x.purpose)} · 매월 ${x.day}일</div></div><div class="exp-amount">${fmt(x.amount)}<div><button class="iconbtn" aria-label="${esc(x.title)} 수정" data-edit="${esc(x.id)}" type="button">✎</button><button class="iconbtn" aria-label="${esc(x.title)} 삭제" data-delete="${esc(x.id)}" type="button">×</button></div></div></div>`).join(''):'<div class="empty">표시할 항목이 없습니다.<br>아래 버튼으로 고정지출을 추가하세요.</div>'}
function render(){const active=expenses.filter(x=>x.active),total=active.reduce((s,x)=>s+x.amount,0);$('grandTotal').textContent=hiddenTotal?'••••••원':fmt(total);$('toggleTotal').textContent=hiddenTotal?'금액 보기':'금액 숨기기';$('toggleTotal').setAttribute('aria-pressed',String(hiddenTotal));$('totalCount').textContent=`지출 중 ${active.length}개 · 일시 중지 ${expenses.length-active.length}개`;
drawChart('homeBankChart','bank');drawChart('bankChart','bank');drawChart('homePurposeChart','purpose');drawChart('purposeChart','purpose');

const allPurposes=['전체',...new Set(expenses.map(x=>x.purpose))],allBanks=['전체',...new Set(expenses.map(x=>x.bank))];

function activateTab(id){tab=id;for(const btn of document.querySelectorAll('[data-tab]')){const selected=btn.dataset.tab===id;btn.classList.toggle('active',selected);btn.setAttribute('aria-selected',String(selected));btn.tabIndex=selected?0:-1}for(const panel of document.querySelectorAll('.tab-panel'))panel.classList.toggle('hidden',panel.id!=='tab-'+id);window.scrollTo({top:0,behavior:'instant'})}

// Swipe: navigate only for deliberate horizontal gestures on the active panel.
const TAB_ORDER=['home','bank','purpose','list'];let touchOrigin=null;
const swipeExcluded=el=>!!el.closest('button,input,select,textarea,a,.filter,.sheet,[contenteditable="true"]');
for(const panel of document.querySelectorAll('.tab-panel')){
 panel.addEventListener('touchstart',event=>{
  if(event.touches.length!==1||swipeExcluded(event.target)||$('overlay').classList.contains('open')){touchOrigin=null;return}
  const point=event.touches[0];touchOrigin={x:point.clientX,y:point.clientY,time:Date.now(),panel:panel.id};
 },{passive:true});
 panel.addEventListener('touchend',event=>{
  if(!touchOrigin||touchOrigin.panel!==panel.id||event.changedTouches.length!==1){touchOrigin=null;return}
  const point=event.changedTouches[0],dx=point.clientX-touchOrigin.x,dy=point.clientY-touchOrigin.y;
  touchOrigin=null;
  if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.35)return;
  const idx=TAB_ORDER.indexOf(tab),next=idx+(dx<0?1:-1);
  if(next>=0&&next<TAB_ORDER.length)activateTab(TAB_ORDER[next]);
 },{passive:true});
 panel.addEventListener('touchcancel',()=>{touchOrigin=null},{passive:true});
}
