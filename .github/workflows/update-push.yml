name: Notify subscribers on fixed-expenses update
on:
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send_update_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify opted-in subscribers after Pages publishes version.json
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python3 scripts/send-update-push.py
