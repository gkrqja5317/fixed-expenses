name: Build native Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [[ -f "$sdk_root/platforms/android-35/android.jar" && -x "$sdk_root/build-tools/35.0.0/aapt2" ]]; then
            exit 0
          fi
          sdkmanager=$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)
          "${sdkmanager:?Android SDK command-line tools are missing}" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fixed-expenses-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
